name: Python CI

on:
  push:
    branches: [main, refactor/architecture]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check aerial_gym/

      - name: Ruff format check
        run: ruff format --check aerial_gym/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment-dev.yaml
          activate-environment: aerialgym-dev
          auto-activate-base: false

      - name: Install package (no GPU deps)
        run: pip install -e ".[test]" --no-deps

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short || test $? -eq 5
