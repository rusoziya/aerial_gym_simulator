# Evaluation config for a trained gate navigation policy.
# Renders the environment with a small number of envs for visual inspection.

mode: eval
framework: sample_factory

common:
  task: navigation_task_gate
  num_envs: 16
  device: "cuda:0"
  headless: false
  use_warp: true

eval:
  checkpoint: "./train_dir/gate_navigation/best.pth"
  num_episodes: 100
  save_gifs: true
  gif_dir: "./eval_gifs"
  # Number of initial steps used to warm up the RNN hidden state.
  rnn_warmup_steps: 50

wandb:
  enabled: true
  project: aerial-gym-gate
  tags: [eval, gate]
