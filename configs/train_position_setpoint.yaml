# Basic position setpoint training with RL-Games.
# Learns a policy that tracks random 3-D position targets.

mode: train
framework: rl_games

common:
  task: position_setpoint_task
  num_envs: 8192
  seed: 42
  device: "cuda:0"
  headless: true
  use_warp: true

training:
  total_steps: 100_000_000
  batch_size: 16384
  learning_rate: 0.0001
  gamma: 0.99
  rollout_horizon: 16
  checkpoint_dir: "./train_dir/position_setpoint"

# RL-Games reads its own network/algorithm config from this file.
rl_games:
  config_file: ppo_aerial_quad.yaml

wandb:
  enabled: false
