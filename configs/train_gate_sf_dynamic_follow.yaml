# Replicates: run_all.sh Run 3/3 — "Dynamic following (2 m), no arc-follow"
#
# Invocation reproduced:
#   ./train_gate_navigation_dual_camera.sh \
#     drone_and_static_dynamic_following_curriculum_L13_23_2metres \
#     --seed=123 --train_steps=2012416 --headless=false --view --envs=128 \
#     --disable_gate_size_randomization=false --fixed_gate_scale_percent=100 \
#     --disable_obstacle_randomization=false --fixed_obstacles_behind_gate=1 \
#     --disable_static_camera_orientation_randomization=false \
#     --disable_drone_camera_noise_randomization=false \
#     --disable_static_camera_noise_randomization=false \
#     --disable_drone_camera_frame_dropout=false --disable_static_camera_frame_dropout=false \
#     --disable_state_noise_randomization=false --disable_spawn_position_randomization=false \
#     --disable_spawn_orientation_randomization=false --disable_curriculum_multiplier=true \
#     --force_curriculum_level=none --min_curriculum_level=13 --max_curriculum_level=23 \
#     --enable_dynamic_camera_following=true --fusion=gated --gate_per_feature=1 \
#     --enable_static_camera_yaw_sweep=false --static_camera_yaw_sweep_speed_deg=180 \
#     --static_camera_base_y=-2.0 --static_camera_base_z=adaptive \
#     --enable_static_camera_locked=false --enable_static_camera_arc_follow=false \
#     --dynamic_camera_follow_y_offset_m=-2.0

mode: train

common:
  task: navigation_task_gate
  num_envs: 128
  seed: 123
  device: "cuda:0"
  headless: false
  use_warp: true

training:
  total_steps: 2_012_416
  batch_size: 8192
  learning_rate: 0.0003
  gamma: 0.98
  rollout_horizon: 32
  max_grad_norm: 1.0
  num_epochs: 4
  checkpoint_interval: 5_000_000
  checkpoint_dir: "./train_dir"

sample_factory:
  env_name: quad_with_obstacles_gate
  experiment_name: drone_and_static_dynamic_following_curriculum_L13_23_2metres
  train_dir: "./train_dir"
  num_workers: 1
  num_envs_per_worker: 1
  use_rnn: true
  rnn_size: 64
  rnn_type: gru
  rnn_num_layers: 1
  encoder_mlp_layers: [512, 256, 64]
  fusion: gated
  gate_per_feature: true
  num_batches_per_epoch: 8
  num_batches_to_accumulate: 2
  save_best_after: 1_000_000
  async_rl: false
  serial_mode: true
  batched_sampling: true
  policy_workers_per_policy: 1
  adaptive_stddev: true
  reward_scale: 0.1
  ppo_clip_ratio: 0.2
  value_loss_coeff: 2.0
  exploration_loss_coeff: 0.001
  nonlinearity: elu
  lr_schedule: kl_adaptive_epoch
  lr_schedule_kl_threshold: 0.016
  normalize_input: true
  normalize_returns: true
  kl_loss_coeff: 0.1
  restart_behavior: resume
  save_every_sec: 1800
  save_best_every_sec: 500
  obs_key: observations
  gae_lambda: 0.95
  with_vtrace: false
  value_bootstrap: true
  train_for_seconds: 0

wandb:
  enabled: true
  project: final_training_gate
  entity: ""
  user: "ziya-ruso-ucl"
  group: gate_navigation_training
  tags: [aerial_gym, gate_navigation, dual_camera, x500, sample_factory, memory_optimized]

curriculum:
  min_level: 13
  max_level: 23
  disable_curriculum_multiplier: true
  disable_gate_size_randomization: false
  disable_obstacle_randomization: false
  fixed_obstacles_behind_gate: 1
  disable_spawn_position: false
  disable_spawn_orientation: false

camera:
  enable_dynamic_following: true
  dynamic_camera_follow_y_offset_m: -2.0
  disable_static_camera_orientation: false
  enable_yaw_sweep: false
  yaw_sweep_speed_deg: 180
  enable_locked_follow: false
  enable_arc_follow: false
  static_camera_base_y: -2.0
  static_camera_base_z: adaptive
  disable_drone_camera_noise: false
  disable_static_camera_noise: false
  disable_drone_camera_frame_dropout: false
  disable_static_camera_frame_dropout: false
  disable_state_noise: false
