# Gate navigation training with Sample Factory (primary use case).
# Trains a dual-camera RNN policy to fly through randomized gate sequences.

mode: train
framework: sample_factory

common:
  task: navigation_task_gate
  num_envs: 256
  seed: 42
  device: "cuda:0"
  headless: true
  use_warp: true

training:
  total_steps: 500_000_000
  batch_size: 2048
  learning_rate: 0.0003
  gamma: 0.98
  rollout_horizon: 32
  max_grad_norm: 1.0
  num_epochs: 4
  checkpoint_interval: 5_000_000
  checkpoint_dir: "./train_dir/gate_navigation"

# Sample Factory-specific hyperparameters.
sample_factory:
  num_workers: 1
  num_envs_per_worker: 1
  use_rnn: true
  rnn_size: 64
  rnn_type: gru
  rnn_num_layers: 1
  encoder_mlp_layers: [256, 128, 64]
  fusion: gated
  gate_per_feature: true
  num_batches_per_epoch: 4
  save_best_after: 1_000_000

wandb:
  enabled: true
  project: aerial-gym-gate
  tags: [gate, dual-camera, curriculum]

# Curriculum difficulty range for gate placement.
curriculum:
  min_level: 3
  max_level: 23

# Static camera placement hints for the gate observation pipeline.
camera:
  static_camera_base_y: -3.0
  static_camera_base_z: adaptive
