# CleanRL training config for position setpoint task.
# Single-file PPO implementation with standard hyperparameters.

mode: train
framework: cleanrl

common:
  task: position_setpoint_task
  num_envs: 2048
  seed: 1
  device: "cuda:0"
  headless: true
  use_warp: true

training:
  total_steps: 3_000_000_000
  batch_size: 65536
  learning_rate: 0.0026
  gamma: 0.99
  rollout_horizon: 32
  checkpoint_dir: "./train_dir/cleanrl_position"

# CleanRL PPO-specific hyperparameters.
cleanrl:
  gae_lambda: 0.95
  num_minibatches: 4
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  anneal_lr: true

wandb:
  enabled: false
