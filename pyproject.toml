[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aerial_gym"
version = "2.0.0"
description = "Isaac Gym environments for Aerial Robots"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.8,<3.9"
authors = [
    {name = "Ziya Ruso", email = "ziya.ruso@gmail.com"},
]
dependencies = [
    "numpy==1.23.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "networkx==2.2",
    "warp-lang==1.0.0",
    "trimesh",
    "urdfpy",
    "gymnasium",
    "pillow>=9.4",
    "pyyaml>=6.0",
    "wandb",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
dev = [
    "black",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    "aerial_gym/sensors/warp/warp_kernels/",
    "aerial_gym/utils/wandb_custom_plot.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["aerial_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
